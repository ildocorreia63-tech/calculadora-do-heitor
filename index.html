<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#941b27"><meta name="description" content="Contas, tabuada e desafios divertidos."><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=3"><title>Calculadora do Heitor</title></head>
<body><main class="app"><header><div class="logo">H</div><div><small>APRENDER BRINCANDO</small><h1>Calculadora <span>do Heitor</span></h1></div><button id="sound">🔊 Som</button></header>
<nav><button class="tab active" data-page="calc">🧮 Calculadora</button><button class="tab" data-page="tabuada">✖️ Tabuada</button><button class="tab" data-page="jogo">⭐ Desafios</button></nav>
<section id="calc" class="page active"><h2>Faça suas contas</h2><div class="calculator"><div class="screen"><small id="expression">Pronto para calcular</small><output id="display">0</output></div><div class="keys">
<button class="util" data-action="clear">AC</button><button class="util" data-action="del">⌫</button><button class="op" data-value="%">%</button><button class="op" data-value="÷">÷</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="op" data-value="×">×</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="op" data-value="−">−</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="op" data-value="+">+</button>
<button class="util" data-action="sign">±</button><button data-value="0">0</button><button data-value=".">.</button><button class="equal" data-action="equal">=</button></div></div>
<div class="tools"><label>🖼️ Escolher fundo <input id="bg" type="file" accept="image/*"></label><button id="reset">Restaurar fundo</button></div></section>
<section id="tabuada" class="page"><h2>Tabuada interativa</h2><label class="choose">Escolha: <select id="table"></select></label><div id="tableGrid" class="table-grid"></div></section>
<section id="jogo" class="page"><h2>Desafios de matemática</h2><div class="scores"><div>PONTOS<strong id="score">0</strong></div><div>ACERTOS<strong id="hits">0</strong></div><div>NÍVEL<strong id="level">1</strong></div></div><div class="quiz"><small>RESOLVA A CONTA</small><div id="question" class="question"></div><div id="answers" class="answers"></div><p id="feedback">Escolha uma resposta!</p><button id="next" disabled>Próximo desafio →</button></div></section>
<footer>Feito para aprender brincando 💛 <b>ILCOR-IA</b></footer></main><script src="script.js"></script></body></html>
